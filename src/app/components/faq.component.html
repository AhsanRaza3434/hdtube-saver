<div class="legal-bg">
  <div class="page-header">
    <a routerLink="/" class="logo-link"><img src="/assets/logos/hdtube-logo.png" alt="HDTube Saver Logo"/></a>
    <div class="nav-links">
      <a routerLink="/faq" class="page-link">FAQ</a>
      <a routerLink="/privacy" class="page-link">Privacy Policy</a>
      <a routerLink="/terms" class="page-link">Terms</a>
    </div>
  </div>
  <div class="page-container">
    <div class="page-title">Frequently Asked Questions (FAQ)</div>
    <div class="faq-accordion">
      <div *ngFor="let faq of faqs; let i = index">
        <button class="faq-question" [class.active]="openedIndex === i" (click)="toggleFaq(i)">
          {{ faq.q }}
        </button>
        <div class="faq-answer" *ngIf="openedIndex === i">
          {{ faq.a }}
        </div>
      </div>
    </div>
  </div>
</div>
