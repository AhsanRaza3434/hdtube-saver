<div class="video-details-container" *ngIf="details">
  <app-conversion-progress></app-conversion-progress>

  <div class="video-thumbnail-title">
    <img [src]="details.thumbnail" [alt]="details.title + ' - YouTube Video Thumbnail'" class="video-thumbnail" loading="lazy" />
    <h2 class="video-title">{{ details.title }}</h2>
  </div>

  <!-- Tabs for switching between Video and Audio -->
  <div class="tab-container" role="tablist" aria-label="Format selection">
    <button
      [class.active]="selectedTab === 'video'"
      (click)="selectTab('video')"
      class="tab-button"
      role="tab"
      [attr.aria-selected]="selectedTab === 'video'"
    >
      Video
    </button>
    <button
      [class.active]="selectedTab === 'audio'"
      (click)="selectTab('audio')"
      class="tab-button"
      role="tab"
      [attr.aria-selected]="selectedTab === 'audio'"
    >
      Audio
    </button>
  </div>

  <!-- Video Table -->
  <div *ngIf="selectedTab === 'video'" role="tabpanel" aria-label="Video formats">
    <table class="details-table">
      <thead>
        <tr>
          <th scope="col">Resolution</th>
          <th scope="col">Format</th>
          <th scope="col">Size</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let format of videoFormats">
          <td>{{ format.resolution }}</td>
          <td>{{ format.format }}</td>
          <td>{{ format.size }}</td>
          <td>
            <button
              class="btn-download"
              (click)="convertToMp4(format)"
              [attr.aria-label]="'Download ' + format.resolution + ' ' + format.format"
            >
              Download
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Audio Table -->
  <div *ngIf="selectedTab === 'audio'" role="tabpanel" aria-label="Audio formats">
    <table class="details-table">
      <thead>
        <tr>
          <th scope="col">Quality</th>
          <th scope="col">Format</th>
          <th scope="col">Size</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let format of audioFormats">
          <td>{{ format.quality }}</td>
          <td>{{ format.format }}</td>
          <td>{{ format.size }}</td>
          <td>
            <button
              (click)="downloadAudio(format)"
              class="btn-download"
              [attr.aria-label]="'Download audio ' + format.quality"
            >
              Download
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
