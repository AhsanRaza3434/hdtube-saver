# Render Blueprint for HDTube Saver API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hdtube-saver-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/video-details
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
