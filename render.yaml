services:
  - type: web
    name: hdtube-saver-api
    env: node
    plan: free
    buildCommand: npm install --production && pip install -U yt-dlp
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
